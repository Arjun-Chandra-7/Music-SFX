[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-sfx"
version = "0.1.0"
description = "Policy-aware, agent-ready professional audio processing service"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Music SFX contributors"}]
dependencies = []

[project.scripts]
music-sfx = "music_sfx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
music_sfx = ["web/*"]

